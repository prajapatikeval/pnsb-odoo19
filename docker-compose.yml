# Local replica of the Render setup: docker compose up --build
# The web container is limited like Render's free plan (512 MB RAM).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pnsb
      POSTGRES_USER: pnsb
      POSTGRES_PASSWORD: pnsb
    volumes:
      - pnsb-db:/var/lib/postgresql/data
  web:
    build: .
    depends_on: [db]
    ports: ["10000:10000"]
    mem_limit: 512m
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: pnsb
      DB_PASSWORD: pnsb
      DB_NAME: pnsb
      ADMIN_PASSWORD: change-me-locally
      MASTER_PASSWORD: local-master
      EXTRA_MODULES: ""
volumes:
  pnsb-db:
